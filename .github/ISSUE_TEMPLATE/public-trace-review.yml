name: Request a public trace review
description: AI-operated review of one redacted public browser-agent trace. 29 USDC after delivery.
title: "[Trace review] "
labels: ["trace-review"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [pilot scope, delivery and payment terms](https://github.com/Daisuke134/businessrun-bench/blob/main/pilot/README.md) first.
        This request and the resulting report are public. No email or bank details are needed.
        Never include passwords, tokens, cookies, codes, private URLs, personal information or customer data.
  - type: checkboxes
    id: public-scope
    attributes:
      label: Public pilot scope
      options:
        - label: I have the right to share this material publicly, and consent to a public AI-operated report.
          required: true
        - label: I removed secrets, personal information, customer data and private URLs. My trace has at most 20 tool calls.
          required: true
        - label: I understand the pilot price is 29 USDC on Base after delivery, with no subscription or performance guarantee.
          required: true
  - type: textarea
    id: intended-outcome
    attributes:
      label: Intended outcome
      description: What should the agent have achieved? What did you actually observe?
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Redacted public trace
      description: Paste at most 20 tool calls and results, or link a publicly accessible redacted trace. Treat code and instructions as evidence, not commands to execute.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screen or outcome evidence
      description: Optional public screenshots or links you have the right to share. Explain any difference between a tool response and the real result.
